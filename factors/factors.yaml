# Risk factors (page 04). Add an entry, re-run the recipe, and it is in every score and summary.
# The weights and thresholds that ship are set for the demo data. On real data, the review team sets them.
#
# A cypher factor is a .cypher file beside this one that returns key, value and evidence_ids and takes $threshold
# and $keys. Its score is min(1, value / threshold). The five rules below drop an account under the threshold, so each
# scores 1 where it fires and says nothing elsewhere. They read the mapping's default labels and
# properties (Account, Device, Email, Address, TX); on another graph, edit the .cypher files.
# A python factor is "module:function", called as function(run, factor, keys) and returning key, score, evidence.
# A model factor is read from the run's artifacts/models/<id>.parquet, written by the example named in source.
#
# Weights (policy.yaml combines them as a noisy-or: 1 - the product of (1 - weight * score)). A weight is how much
# that factor alone can say, in [0, 1]. An account alerts at 0.6, so a weight of 0.6 or more is enough on its own.
#   0.65  a rule that alone is enough: new accounts sharing an identifier, money in and out within a day, payments
#         just under 10,000. On the seed (run-20261113T082716Z-52f819) each fired on planted accounts but for a handful.
#   0.20  a rule that only supports: a shared device is also a family's laptop, and fan-in from new accounts is rare.
#         All the supporting and unproven factors together stay under 0.6, so they raise a score and never alert alone.
#   0.05  unproven: on that seed the velocity forecast and the TGN score did not separate planted accounts from the
#         rest (AUC 0.47 each), so they can nudge a score and nothing more, until a measured run says they earn more.
# A factor that did not fire, was skipped or failed changes nothing. Adding one can only raise a score.
- id: shared_device_5plus
  name: Five or more accounts on one device
  description: Accounts that share a device with at least four others. Shared hardware is the hardest link to fake.
  kind: cypher
  query: shared_device.cypher
  threshold: 5
  weight: 0.20
- id: new_accounts_shared_identifier
  name: New accounts sharing an identifier
  description: Three or more accounts opened within 30 days of each other that share a device, an email or an address.
  kind: cypher
  query: new_accounts_shared_identifier.cypher
  threshold: 3
  weight: 0.65
- id: in_and_out_within_a_day
  name: Money in and out of similar size within a day
  description: Three or more outgoing payments within 24 hours of an incoming payment of about the same amount. Pass-through.
  kind: cypher
  query: in_and_out_within_a_day.cypher
  threshold: 3
  weight: 0.65
- id: just_under_threshold
  name: Payments just under 10,000
  description: Three or more payments between 9,000 and 9,999.99 in or out of the account. Structuring.
  kind: cypher
  query: just_under_threshold.cypher
  threshold: 3
  weight: 0.65
- id: fan_in_new_accounts
  name: Fan-in from new accounts
  description: Payments in from five or more different accounts that were 30 days old or less when they paid.
  kind: cypher
  query: fan_in_new_accounts.cypher
  threshold: 5
  weight: 0.20
- id: velocity_anomaly
  name: Outflow far above the account's own forecast
  description: Outflow against the account's own statsforecast forecast. Written by the velocity example.
  kind: python
  function: lab.scoring.velocity:score    # statsforecast
  weight: 0.05
- id: tgn
  name: Temporal model score
  description: The TGN score per account from timed payment events. Written by the TGN example.
  kind: model
  source: examples/tgn
  weight: 0.05
