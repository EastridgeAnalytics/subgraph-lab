[project]
name = "subgraph-lab"
version = "0.1.0"
description = "Pull a subgraph from Neo4j into Relate, let open-source models learn from it, and push the results back."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "relate-db==1.0.1",
    "neo4j>=5.28",
    "pyarrow>=18",
    "polars>=1.20",
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "mcp>=1.6",
    "anthropic>=0.69",
    "networkx==3.7.*",
    "statsforecast==2.1.*",
    "torch==2.12.*",
    "torch-geometric==2.8.*",
    "pyg-lib==0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
pyg-lib = [{ index = "pyg-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.12.0+cpu.html"
format = "flat"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab", "generator", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs docker compose --profile local up (the bundled Neo4j and the Relate server)",
    "slow: trains a model or builds the 1M-relationship seed",
]
addopts = "-m 'not live and not slow'"
timeout = 300

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
